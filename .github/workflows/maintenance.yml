name: Monthly scheduler activity
on:
  schedule:
    - cron: '7 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record scheduler maintenance date only
        run: |
          mkdir -p maintenance
          date -u +%Y-%m-%d > maintenance/heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maintenance/heartbeat.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record monthly scheduler maintenance'
          git push origin HEAD:main
