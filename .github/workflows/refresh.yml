name: Daily bounded refresh
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - id: tests
        run: node --test tests/*.test.mjs
      - name: Refresh approved sources
        run: node scripts/run-cloud.mjs --cloud --apply
        env:
          PROPERTY_REFRESH_DATABASE_URL: ${{ secrets.PROPERTY_REFRESH_DATABASE_URL }}
      - name: Discover bounded review candidates
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: node scripts/discover-cloud.mjs
        env:
          PROPERTY_REFRESH_DATABASE_URL: ${{ secrets.PROPERTY_REFRESH_DATABASE_URL }}
      - name: Numerical run summary
        if: always()
        run: node scripts/summary.mjs
